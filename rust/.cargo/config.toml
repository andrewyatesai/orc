# Cargo splits this feature across three keys, and each spelling is load-bearing:
# the [unstable] pair are FEATURE GATES (both `true` — setting one false disables
# the gate and cargo errors), while the top-level key below carries the actual
# POLICY: `false` = the [target.*] rustflags below do not reach host units
# (build scripts, proc-macros), which then take the [host] table's flags instead.
target-applies-to-host = false

# Vendored, offline-by-construction dependency sources. Every third-party crate
# Orca uses is checked into rust/vendor (see docs/rust-migration/architecture.md
# "Dependency vendoring & stripping policy"). Builds resolve crates from there,
# never the network.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true

# COMPILE WITH TRUST, WITH VERIFICATION ON. The Trust toolchain (repo-root
# rust-toolchain, or the machine default) compiles this workspace, and the
# batteries-on typed verification pipeline runs during compilation.
#
# The 2026-07-18 blanket opt-out is retired; nothing under rust/ turns the
# verifier off on a build lane any more.
#
# WHAT IS VERIFIED / WHAT IS ASSUMED. Every unit is lowered and every obligation
# is checked, but `advisory` reports verdicts instead of failing on them — so the
# build is verified-and-reported, NOT verified-clean. The residue is one gap, not
# many bugs: ~69% of all obligations fail as "absent callee (a std/extern function
# whose body is not in the lowered bundle)", which no source change reaches. That
# is the Trust-Std campaign, and until it lands every std call is an assumption.
#
# FLAG SURFACE, MEASURED 2026-08-18 — the three flags this table used to set are
# GONE from the installed stage2, and every unit under rust/ failed flag-parse
# while they were here, so the verifier was not running at all:
#
#     -Ztrust-verify                          unknown unstable option
#     -Ztrust-policy                          unknown unstable option
#     -Ztrust-verify-function-budget-steps    unknown unstable option
#
# `config/scripts/check-trust-flag-surface.mjs` now probes this table against
# `rustc -Z help` so the next flip is a named failure instead of a build that
# quietly compiles as vanilla Rust. Run it before editing anything below; do NOT
# "fix" a rejection by clearing RUSTFLAGS or building from a directory where this
# table is not read, because both turn the verifier off silently.
#
# WHAT REPLACED THEM:
#   * verification is BATTERIES-ON by default, so there is nothing to switch on.
#     `-Zno-trust-verify` is the sole off-switch.
#   * the default policy is STRICT — confirmed directly: a function with one
#     unproved obligation is a build error. `-Ztrust-lame` is what `advisory` was,
#     "report Trust verification failures without forced-counterexample
#     escalation (verification still runs non-fatally)".
#   * the step budget became a wall-clock twin, `-ms`.
#
# WHY THE `-ms` BUDGET, WHICH THIS FILE USED TO FORBID. The old text said "Never
# use the `-ms` wall-clock twin: it silently drops the slowest functions and
# breaks build reproducibility", and prescribed the step budget instead. That
# advice was correct WHEN A STEP BUDGET EXISTED. It does not. And the hang it was
# written for is still live — measured today, `rustc --crate-name memchr` ran
# 4m17s on that one crate with no output and no sign of terminating.
#
# So the real choice is not "steps vs ms", it is "verification that terminates"
# against "verification that hangs", and a verifier that hangs is a verifier
# nobody leaves on. The `-ms` downside is real and unfixed: a function that
# exceeds the budget is reported as timed-out rather than proved, and which
# functions those are can vary with machine load. Read the verdict counts
# accordingly — a timed-out obligation is an ASSUMPTION, exactly like the absent-
# callee residue above, not a proof.
#
# RESTORE THE STEP BUDGET the day it returns: swap the `-ms` line for
# `-Ztrust-verify-function-budget-steps=100000` and re-run the probe script.
#
# WHY NOT `strict`: cargo has no per-package rustflags (`[profile.*.package]`
# takes profile keys only, and Trust's own `-Ztrust-verify-crate-role` says
# outright it "never changes verifier scope"). One policy therefore covers
# first-party AND vendor. Vendored code holds nothing above advisory; gating our
# crates with strict would only make the workspace refuse to build.
#
# RATCHET a single crate back to a real gate. RUSTFLAGS overrides this table
# wholesale, so every flag must be repeated:
#
#     CARGO_TARGET_DIR=target/pol \
#       RUSTFLAGS="-Ztrust-verify-function-budget-ms=5000" \
#       cargo build -p orca-stream-split
#
# Crates that hold a real policy today: orca-stream-split and orca-provider-backoff
# at `certify`, aterm-hash at `strict`. Everything else needs the Trust-Std bundle.
[target.aarch64-apple-darwin]
rustflags = [
  # Non-fatal reporting: what `-Ztrust-policy=advisory` used to do.
  "-Ztrust-lame",
  # Without a budget, memchr does not terminate (measured 4m17s, still running).
  # Tune this rather than removing it; removing it hangs the build.
  "-Ztrust-verify-function-budget-ms=5000",
]
# Cargo does not forward target rustflags to trustdoc, so doctests would silently
# fall back to the default — state it rather than inherit it by accident.
#
# STABLE LANE: stock rustdoc rejects these -Z flags, so on a machine without the
# Trust toolchain `cargo +stable test --workspace` dies at the doc-test phase
# even after RUSTFLAGS='' — doctests read THIS table, which RUSTFLAGS does not
# override. The stable test entrypoint (`pnpm run test:rust`, i.e.
# config/scripts/run-rust-tests.mjs) clears RUSTDOCFLAGS alongside RUSTFLAGS;
# do the same in any new stable-lane script that runs doctests.
# `-Zno-trust-verify` is the ONE trust flag the embedded doctest frontend
# accepts — rustc_driver_impl calls it a "redundant deauthorization", since
# EmbeddedNoOfficialEvidence forces verification off internally anyway. It is
# not redundant HERE: without it, the merged-doctest child compile falls back to
# the compiler defaults (verify ON, policy STRICT) and fail-closes on the
# unproved panic obligations every assert-style doctest body carries. Any other
# trust flag in this table is rejected outright by the same frontend, loudly.
# Net: doctests compile-and-run deauthorized — a stated policy, not a silent
# fallback.
rustdocflags = ["-Zno-trust-verify"]

# Build scripts and proc-macros compile for the HOST and never need verification —
# and the current stage2 ICEs (SignatureMismatch on std closures, rustc_traits/
# codegen.rs:45) when the verify pipeline runs over exactly the code shape
# proc-macro2's and zmij's build scripts have. With target-applies-to-host off,
# the [target.*] rustflags above stop reaching host units: workspace code stays
# verified, build scripts compile deauthorized. Remove when the upstream ICE is
# fixed.
[unstable]
target-applies-to-host = true
host-config = true

[host]
rustflags = ["-Zno-trust-verify"]
