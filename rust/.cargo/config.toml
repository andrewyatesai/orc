# Vendored, offline-by-construction dependency sources. Every third-party crate
# Orca uses is checked into rust/vendor (see docs/rust-migration/architecture.md
# "Dependency vendoring & stripping policy"). Builds resolve crates from there,
# never the network.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true

# COMPILE WITH TRUST, WITH VERIFICATION ON. The Trust toolchain (repo-root
# rust-toolchain, or the machine default) compiles this workspace, and the
# batteries-on typed verification pipeline runs during compilation.
#
# The 2026-07-18 blanket opt-out is retired; nothing under rust/ turns the
# verifier off on a build lane any more.
#
# WHAT IS VERIFIED / WHAT IS ASSUMED. Every unit is lowered and every obligation
# is checked, but `advisory` reports verdicts instead of failing on them — so the
# build is verified-and-reported, NOT verified-clean. The residue is one gap, not
# many bugs: ~69% of all obligations fail as "absent callee (a std/extern function
# whose body is not in the lowered bundle)", which no source change reaches. That
# is the Trust-Std campaign, and until it lands every std call is an assumption.
#
# WHY NOT `strict`: `-Ztrust-policy` is a rustflag, and cargo has no per-package
# rustflags (`[profile.*.package]` takes profile keys only, and Trust's own
# `-Ztrust-verify-crate-role` says outright it "never changes verifier scope").
# One policy therefore covers first-party AND vendor. Vendored code holds nothing
# above advisory; picking strict to gate our crates would only make the workspace
# refuse to build, and picking advisory is the price of that being workspace-wide.
# The strict gate survives per crate, as a ratchet — see the probe below.
#
# MEMCHR HANG: `memchr` verification did not terminate on stage2 51bf8a270 under
# any policy (2026-07-18 bug, still live). The step budget below is the fix — a
# monotone-decreasing preprocessing bound that terminates with the clock disabled,
# measured verdict-identical from 1e4 to 1e9. Never use the `-ms` wall-clock twin:
# it silently drops the slowest functions and breaks build reproducibility.
#
# PROBE before editing either flag — both spellings are a property of the
# INSTALLED stage2, not of the calendar, and this has flipped twice on toolchain
# swaps alone (`-Zno-trust-verify` was DELETED and fails flag-parse on EVERY unit,
# build scripts included, so nothing under rust/ compiles when it is set):
#
#     rustup run trust rustc -Z help | grep trust-verify
#
# RATCHET a single crate back to a real gate (advisory is not a gate). RUSTFLAGS
# overrides this table wholesale, so `-Ztrust-verify=on` must be repeated:
#
#     CARGO_TARGET_DIR=target/pol RUSTFLAGS="-Ztrust-verify=on \
#       -Ztrust-verify-function-budget-steps=100000 -Ztrust-policy=strict" \
#       cargo build -p orca-stream-split
#
# Crates that hold a real policy today: orca-stream-split and orca-provider-backoff
# at `certify`, aterm-hash at `strict`. Everything else needs the Trust-Std bundle.
[target.aarch64-apple-darwin]
rustflags = [
  "-Ztrust-verify=on",
  "-Ztrust-verify-function-budget-steps=100000",
  "-Ztrust-policy=advisory",
]
# Cargo does not forward target rustflags to trustdoc, so doctests would silently
# fall back to the default — state it rather than inherit it by accident.
#
# STABLE LANE: stock rustdoc rejects these -Z flags, so on a machine without the
# Trust toolchain `cargo +stable test --workspace` dies at the doc-test phase
# even after RUSTFLAGS='' — doctests read THIS table, which RUSTFLAGS does not
# override. The stable test entrypoint (`pnpm run test:rust`, i.e.
# config/scripts/run-rust-tests.mjs) clears RUSTDOCFLAGS alongside RUSTFLAGS;
# do the same in any new stable-lane script that runs doctests.
# EMPTY on purpose, and load-bearing: trustdoc's embedded doctest frontend
# REFUSES verification controls outright ("EmbeddedNoOfficialEvidence compiler
# frontend rejects semantic, evidence, or backend control `-Ztrust-verify`"),
# so carrying the trust flags here fails every doctest run loudly. Doctests
# compile-and-run UNVERIFIED by the toolchain's own policy — a refusal, not a
# silent fallback — and that refusal is the honest behavior.
rustdocflags = []
