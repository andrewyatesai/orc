# Cargo splits this feature across three keys, and each spelling is load-bearing:
# the [unstable] pair are FEATURE GATES (both `true` — setting one false disables
# the gate and cargo errors), while the top-level key below carries the actual
# POLICY: `false` = the [target.*] rustflags below do not reach host units
# (build scripts, proc-macros), which then take the [host] table's flags instead.
target-applies-to-host = false

# Trust verification flags for cargo invocations that START AT THE REPO ROOT.
#
# Cargo reads config from the CURRENT directory upward, so rust/.cargo/config.toml
# is invisible to `cargo --manifest-path rust/Cargo.toml ...` run from here — the
# invocation every gate script and most agents use. Before this file existed those
# builds compiled as vanilla Rust with no warning, or (once the trust toolchain
# became the pinned default) verified under the WRONG settings: strict policy and
# no step budget, the exact combination rust/.cargo/config.toml documents as a
# hang (memchr) and a workspace-wide refusal (vendor crates under strict).
#
# Values are IDENTICAL to rust/.cargo/config.toml's — one policy, two entry
# points. Keep them in lockstep. Vendoring/offline stays in rust/.cargo only:
# the `vendor` path is relative to that directory, and native/orca-node resolves
# its own dependencies.
[target.aarch64-apple-darwin]
rustflags = [
  # MEASURED 2026-08-18: -Ztrust-verify, -Ztrust-policy and
  # -Ztrust-verify-function-budget-steps are all GONE from the installed stage2,
  # and every unit failed flag-parse while they were set here. Verification is
  # batteries-on by default now; -Ztrust-lame is what `advisory` was; the step
  # budget became a wall-clock twin, and without a budget memchr does not
  # terminate (measured 4m17s). Full rationale in rust/.cargo/config.toml.
  # `config/scripts/check-trust-flag-surface.mjs` probes BOTH files.
  "-Ztrust-lame",
  "-Ztrust-verify-function-budget-ms=5000",
]
# `-Ztrust-verify=off` is the ONE trust flag the embedded doctest frontend
# accepts — rustc_driver_impl calls it a "redundant deauthorization", since
# EmbeddedNoOfficialEvidence forces verification off internally anyway. It is
# not redundant HERE: without it, the merged-doctest child compile falls back to
# the compiler defaults (verify ON, policy STRICT) and fail-closes on the
# unproved panic obligations every assert-style doctest body carries. Any other
# trust flag in this table is rejected outright by the same frontend, loudly.
# Net: doctests compile-and-run deauthorized — a stated policy, not a silent
# fallback.
rustdocflags = ["-Zno-trust-verify"]

# Build scripts and proc-macros compile for the HOST and never need verification —
# and the current stage2 ICEs (SignatureMismatch on std closures, rustc_traits/
# codegen.rs:45) when the verify pipeline runs over exactly the code shape
# proc-macro2's and zmij's build scripts have. With target-applies-to-host off,
# the [target.*] rustflags above stop reaching host units: workspace code stays
# verified, build scripts compile deauthorized. Remove when the upstream ICE is
# fixed.
[unstable]
target-applies-to-host = true
host-config = true

[host]
rustflags = ["-Zno-trust-verify"]
